<div class="toast-container position-fixed top-0 end-0 p-3">

  <!-- Info toast -->
  <div *ngIf="gS?.errorType === 'Info'" id="myToast" class="toast bg-info text-white" role="alert" aria-live="assertive"
    aria-atomic="true" data-bs-delay="3000">
    <div class="toast-header">
      <strong class="me-auto">Info</strong>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body">
      {{gS?.errorMessage}}
    </div>
  </div>

  <!-- Success toast -->
  <div *ngIf="gS?.errorType === 'Success'" id="myToast" class="toast bg-success text-white" role="alert"
    aria-live="assertive" aria-atomic="true" data-bs-delay="3000">
    <div class="toast-header bg-success text-white">
      <strong class="me-auto">Success</strong>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body">
      {{gS?.errorMessage}}
    </div>
  </div>

  <!-- Error toast -->
  <div *ngIf="gS?.errorType === 'Error'" id="myToast" class="toast bg-danger text-white" role="alert"
    aria-live="assertive" aria-atomic="true" data-bs-delay="3000">
    <div class="toast-header bg-danger text-white">
      <strong class="me-auto">Error</strong>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body">
      {{gS?.errorMessage}}
    </div>
  </div>

  <!-- waring toast -->
   <div *ngIf="gS?.errorType === 'Warning'" id="myToast" class="toast bg-warning text-dark" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="3000">
    <div class="toast-header bg-warning text-dark">
      <strong class="me-auto">Warning</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body">
      {{gS?.errorMessage}}
    </div>
  </div>
</div>
