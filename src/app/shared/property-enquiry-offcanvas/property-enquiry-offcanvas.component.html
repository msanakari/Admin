<div class="offcanvas offcanvas-end" [class.show]="isOpen" data-bs-scroll="false" tabindex="-1" id="buyOffcanvas">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title fw-bold">{{title}}</h5>
    <button type="button" class="btn-close text-reset" (click)="closeOffcanvas()"></button>
  </div>
  <div class="offcanvas-body" *ngIf="inqueryData">
    <div class="form_details d-flex flex-column gap-3">
      <div class="form_field d-flex gap-1 flex-column">
        <p class="m-0 fw-bold">Property Id</p>
        <div class="input_box px-3 py-2">
          <p class="m-0">{{inqueryData?.propertyId}}</p>
        </div>
      </div>
      
      <p class="title mt-3 fs-5 fw-bold">Contact Details</p>
      <div class="form_field d-flex gap-1 flex-column" >
        <p class="m-0 fw-bold">First Name</p>
        <div class="input_box px-3 py-2">
          <p class="m-0">{{inqueryData?.firstName}}</p>
        </div>
      </div>
      <div class="form_field d-flex gap-1 flex-column">
        <p class="m-0 fw-bold">Last Name</p>
        <div class="input_box px-3 py-2">
          <p class="m-0">{{inqueryData?.lastName}}</p>
        </div>
      </div>
      <div class="form_field d-flex gap-1 flex-column" *ngIf="inqueryData?.email">
        <p class="m-0 fw-bold">Email</p>
        <div class="input_box px-3 py-2">
          <p class="m-0">{{inqueryData?.email}}</p>
        </div>
      </div>
      <div class="form_field d-flex gap-1 flex-column" >
        <p class="m-0 fw-bold">Phone Number</p>
        <div class="input_box px-3 py-2">
          <p class="m-0">{{inqueryData?.countryCode}} {{inqueryData?.phoneNumber}}</p>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="offcanvas-backdrop fade show"></div>
