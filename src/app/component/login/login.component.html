<div class="page-wrapper">
    <div class="auth-bg">
        <div class="authentication-box">
            <div class="brand-logo">
                <img src="assets/images/logo_6.svg" alt="Logo" />
                <!-- <p>Realbucs</p> -->
            </div>

            <div class="card mt-4">
                <div class="card-body">
                    <div class="text-center">
                        <h4>LOGIN</h4>
                        <h6>Enter your Username and Password</h6>
                    </div>

                    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="theme-form" novalidate>
                        <div class="form-group">
                            <label class="col-form-label pt-0">Email</label>
                            <input formControlName="email" type="email" class="form-control"
                                [ngClass]="{'is-invalid': submitted && loginForm.controls['email'].errors}" />
                            <div class="invalid-feedback" *ngIf="submitted && loginForm.controls['email'].errors">
                                <div *ngIf="loginForm.controls['email'].errors['required']">Email is required</div>
                                <div *ngIf="loginForm.controls['email'].errors['email']">Invalid email format</div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-form-label">Password</label>
                            <input formControlName="password" type="password" class="form-control"
                                [ngClass]="{'is-invalid': submitted && loginForm.controls['password'].errors}" />
                            <div class="invalid-feedback" *ngIf="submitted && loginForm.controls['password'].errors">
                                Password is required
                            </div>
                        </div>

                        <div class="form-group row mt-3 mb-0">
                            <button type="submit" class="btn btn-primary btn-block btn-lg">
                                Login
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
